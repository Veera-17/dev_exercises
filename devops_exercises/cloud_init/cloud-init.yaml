#cloud-config

# Explicitly set timezone to avoid legacy tzdata mismatch (Asia/Calcutta -> Asia/Kolkata)
timezone: Asia/Kolkata

# 1. Update package list and install required software
package_update: true
package_upgrade: false
packages:
  - docker.io
  - git
  - curl
  - ffmpeg

# 2. Create the non-root user 'testpress' with Docker permissions (Least Privilege)
groups:
  - docker

users:
  - default
  - name: testpress
    gecos: Testpress Service User
    primary_group: testpress
    groups: [docker]
    shell: /bin/bash
    lock_passwd: true

# 3. Create /opt/testpress and write app.env + systemd service
# Note: Initial owner is root:root to avoid module crash before users are created.
write_files:
  - path: /opt/testpress/app.env
    owner: root:root
    permissions: '0644'
    content: |
      APP_ENV=production
      APP_PORT=8080
      MESSAGE=Hello from Testpress!

  - path: /etc/systemd/system/testpress-app.service
    owner: root:root
    permissions: '0644'
    content: |
      [Unit]
      Description=Testpress Demo HTTP Application
      After=docker.service
      Requires=docker.service

      [Service]
      TimeoutStartSec=0
      Restart=always
      ExecStartPre=-/usr/bin/docker stop testpress-demo
      ExecStartPre=-/usr/bin/docker rm testpress-demo
      ExecStartPre=/usr/bin/docker pull hashicorp/http-echo:latest
      ExecStart=/usr/bin/docker run --name testpress-demo \
        --env-file /opt/testpress/app.env \
        -p 8080:5678 \
        hashicorp/http-echo:latest -text "Hello from Testpress!"
      ExecStop=/usr/bin/docker stop testpress-demo

      [Install]
      WantedBy=multi-user.target

# 4. Post-provisioning setup & start service
runcmd:
  - chown -R testpress:testpress /opt/testpress
  - chmod 0640 /opt/testpress/app.env
  - systemctl daemon-reload
  - systemctl enable testpress-app.service
  - systemctl start testpress-app.service
