services:
  minio:
    image: elestio/minio:latest
    container_name: rclone_exercise_minio
    env_file:
      - .env
    ports:
      - "${MINIO_HOST_PORT}:9000"           # S3 API (configured in .env)
      - "${MINIO_HOST_CONSOLE_PORT}:9001"   # Web Console (configured in .env)
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  minio_data:
    driver: local
